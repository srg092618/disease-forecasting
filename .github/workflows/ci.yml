name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  refresh:
    # Rebuild forecasts and the dashboard with the newest outbreak data, weekly or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m epicast run --jobs 2 --live-outbreak
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: |
            outputs/dashboard.html
            outputs/metrics_overall.csv
            outputs/forecasts.csv
            outputs/run_manifest.json
